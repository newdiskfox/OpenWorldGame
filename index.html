
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN WORLD GAME</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:25px 14px;
 display:flex;align-items:center;justify-content:center;
 font-family:Arial,sans-serif;color:#fff;
 background:radial-gradient(circle at top,#163b75,#07152e 65%,#030a18);
}
.container{
 width:100%;max-width:760px;padding:30px;
 border:1px solid #ffffff24;border-radius:25px;
 background:linear-gradient(145deg,#102b50eF,#071a35f2);
 box-shadow:0 20px 70px #0008;
}
h1{text-align:center;font-size:34px;margin:5px 0 8px;letter-spacing:2px}
.subtitle{text-align:center;color:#a9c8ef;margin-bottom:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{
 text-align:center;padding:18px 8px;border-radius:15px;
 background:#ffffff0d;border:1px solid #ffffff18
}
.stat strong{display:block;font-size:27px;margin-bottom:7px}
.stat span{font-size:12px;color:#a9c8ef}
button{
 width:100%;border:0;border-radius:13px;padding:17px 12px;
 font-weight:800;font-size:15px;cursor:pointer;
 transition:.2s;margin-top:12px
}
button:hover{filter:brightness(1.13);transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.offer-btn{background:linear-gradient(90deg,#00d4ff,#287bff);color:#06162c}
.auto-btn{background:linear-gradient(90deg,#12df9b,#00a978);color:#03251b}
.status-btn{background:#ffffff12;color:white;border:1px solid #ffffff25}
#message{
 margin-top:20px;padding:15px;border-radius:12px;
 background:#ffffff0d;text-align:center;overflow-wrap:anywhere;
 color:#d7eaff;line-height:1.6;min-height:52px
}
#offerLink{display:none;margin-top:12px;text-align:center}
#offerLink a{color:#55dfff;overflow-wrap:anywhere}
.footer{text-align:center;color:#7695bb;font-size:12px;margin-top:24px}
@media(max-width:520px){
 .container{padding:21px 16px}
 h1{font-size:27px}
 .stats{gap:7px}
 .stat strong{font-size:22px}
 .stat span{font-size:10px}
}
</style>
</head>
<body>
<main class="container">
 <h1>🌍 OPEN WORLD GAME</h1>
 <div class="subtitle">Get your unique offer link</div>

 <section class="stats">
  <div class="stat"><strong id="total">—</strong><span>TOTAL LINKS</span></div>
  <div class="stat"><strong id="available">—</strong><span>AVAILABLE</span></div>
  <div class="stat"><strong id="claimed">—</strong><span>CLAIMED</span></div>
 </section>

 <button class="offer-btn" id="offerButton" onclick="getOffer()">🎁 GET YOUR OFFER</button>
 <button class="auto-btn" id="autoButton" onclick="autoOffer()">🚀 START AUTO CLICK</button>
 <button class="status-btn" onclick="checkStatus()">↻ REFRESH STATUS</button>

 <div id="message">Click GET YOUR OFFER to receive one unique link.</div>
 <div id="offerLink"></div>

 <div class="footer">OPEN WORLD GAME • Offer Distribution System</div>
</main>

<script>
const API = "https://openworldgame-api.golpomayakonna92.workers.dev";

let assigned = false;
let assignedUrl = "";

const message = document.getElementById("message");
const offerLink = document.getElementById("offerLink");
const offerButton = document.getElementById("offerButton");
const autoButton = document.getElementById("autoButton");

function showMessage(text){
 message.textContent = text;
}

async function apiRequest(path){
 const response = await fetch(API + path);
 const data = await response.json().catch(()=>({}));
 if(!response.ok){
  throw new Error(data.error || data.message || `HTTP ${response.status}`);
 }
 return data;
}

async function checkStatus(){
 try{
  const data = await apiRequest("/admin/status-public");
  document.getElementById("total").textContent = data.total ?? "—";
  document.getElementById("available").textContent = data.available ?? "—";
  document.getElementById("claimed").textContent = data.used ?? "—";
 }catch(error){
  console.error(error);
 }
}

async function getOffer(){
 if(assigned){
  showMessage("You have already received your offer on this page.");
  return assignedUrl;
 }

 offerButton.disabled = true;
 autoButton.disabled = true;
 showMessage("Please wait. Getting your offer...");

 try{
  const data = await apiRequest("/api/offer");

  if(!data.success || !data.url){
   showMessage(data.error || "No offers available. Please try again later.");
   return null;
  }

  assigned = true;
  assignedUrl = data.url;

  offerLink.style.display = "block";
  offerLink.innerHTML = "";
  const a = document.createElement("a");
  a.href = assignedUrl;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = "OPEN YOUR OFFER";
  offerLink.appendChild(a);

  showMessage("Your unique offer is ready. Click OPEN YOUR OFFER.");
  await checkStatus();
  return assignedUrl;

 }catch(error){
  showMessage("❌ " + error.message);
  return null;
 }finally{
  offerButton.disabled = false;
  autoButton.disabled = false;
 }
}

async function autoOffer(){
 const url = await getOffer();
 if(url){
  window.open(url, "_blank", "noopener,noreferrer");
 }
}

checkStatus();
</script>
</body>
</html>
